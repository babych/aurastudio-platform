name: Deploy AuraStudio AI Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: "Deploy to Cloudflare Edge and Modal GPU"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          npm install -g wrangler
          pip install modal pydantic fastapi

      - name: "Deploy to Cloudflare Workers and Pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: "Deploy to Modal Cloud GPU Primary"
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python -m modal deploy modal/modal_qwen_service.py

      - name: "Deploy to Modal Cloud GPU Secondary"
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
        run: |
          python -m modal deploy modal/modal_qwen_service.py

      - name: "Run Production Integration Tests"
        run: |
          python tests/test_integration.py
